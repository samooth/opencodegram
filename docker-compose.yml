services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        OPENCODE_VERSION: "2.2.7"
    container_name: opencode-server
    working_dir: /workspace
    volumes:
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode
      - ${OPENCODE_DIRECTORY:-/tmp}:/workspace
    env_file: ".env"
    environment:
      # Shared with the bot. Required.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      # Optional provider keys (OpenCode Zen / Kilo gateway). Leave blank to disable.
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - KILO_API_KEY=${KILO_API_KEY:-}
    ports:
      - "127.0.0.1:49374:49374"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{content_type}' -H \"Authorization: Basic $(printf 'opencode:%s' \"$OPENCODE_SERVER_PASSWORD\" | base64)\" http://127.0.0.1:49374/api/info | grep -q 'application/json'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  bot:
    build: .
    container_name: opencodegram
    depends_on:
      opencode:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_USER_ID=${ADMIN_TELEGRAM_USER_ID}
      - OPENCODE_BASE_URL=http://opencode:49374
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      - OPENCODE_DIRECTORY=/workspace
      - WEBHOOK_MODE=${WEBHOOK_MODE:-false}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - OPS_PORT=9090
    volumes:
      # Persisted state. The host folder must be writable by uid 1000 (bun):
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/app/data
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  opencode-config:
  opencode-data: