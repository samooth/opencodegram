services:
  opencode:
    build:
      context: .
      dockerfile: Dockerfile.opencode
      args:
        OPENCODE_VERSION: "2.3.0"
        ENABLE_BROWSE: "${ENABLE_BROWSE:-0}"
    container_name: opencode-server
    working_dir: /workspace
    volumes:
      - opencode-config:/root/.config/opencode
      - opencode-data:/root/.local/share/opencode
      - playwright-profile:/root/.cache/ms-playwright
      - ${OPENCODE_DIRECTORY:-/tmp}:/workspace
    env_file: ".env"
    environment:
      # Shared with the bot. Required.
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      # Optional provider keys (OpenCode Zen / Kilo gateway). Leave blank to disable.
      - OPENCODE_API_KEY=${OPENCODE_API_KEY:-}
      - KILO_API_KEY=${KILO_API_KEY:-}
      # Browse toggle (1/true to enable). Playwright is always enabled.
      - ENABLE_BROWSE=${ENABLE_BROWSE:-0}
      - OPENCODE_BROWSER_TOOLS=plain
      - OPENCODE_BROWSER_AUTO_UPDATE=${OPENCODE_BROWSER_AUTO_UPDATE:-off}
    ports:
      - "127.0.0.1:49374:49374"
      # Browse relay WebSocket ports (only used when ENABLE_BROWSE=1; bound to localhost).
      - "127.0.0.1:19988:19988"
      - "127.0.0.1:19990:19990"
      - "127.0.0.1:19991:19991"
      - "127.0.0.1:19992:19992"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{content_type}' -H \"Authorization: Basic $(printf 'opencode:%s' \"$OPENCODE_SERVER_PASSWORD\" | base64)\" http://127.0.0.1:49374/api/info | grep -q 'application/json'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  bot:
    build: .
    container_name: opencodegram
    depends_on:
      opencode:
        condition: service_healthy
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ADMIN_TELEGRAM_USER_ID=${ADMIN_TELEGRAM_USER_ID}
      - OPENCODE_BASE_URL=http://opencode:49374
      - OPENCODE_SERVER_PASSWORD=${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      - OPENCODE_DIRECTORY=/workspace
      - WEBHOOK_MODE=${WEBHOOK_MODE:-false}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-}
      - OPS_PORT=9090
    volumes:
      # Persisted state. The host folder must be writable by uid 1000 (bun):
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/app/data
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

volumes:
  opencode-config:
  opencode-data:
  playwright-profile: